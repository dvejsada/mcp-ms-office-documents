# Dynamic DOCX Template Configuration
#
# Define custom Word document templates with placeholders that AI can fill in.
# Each template creates an MCP tool that generates documents from the template.
#
# Placeholder syntax in DOCX files:
#   {{placeholder_name}} - replaced with the value (supports markdown formatting)
#
# =============================================================================
# CONDITIONAL BLOCKS (optional)
# =============================================================================
# Wrap a range of body content between marker paragraphs so it is included only
# when a boolean argument is set. Put each marker on its OWN paragraph (its whole
# text must be just the marker), with the content to keep/drop in between:
#
#   {{#if include_clause}}        keep the block when include_clause is true
#   This clause appears only when the argument is true.
#   (any paragraphs, lists, page breaks or whole tables may go here)
#   {{/if}}
#
#   {{^if include_clause}}        keep the block when include_clause is false
#   Shown only when include_clause is false.
#   {{/if}}
#
# Notes:
#   - The condition name must match a template argument (declare it as type: bool).
#     An unknown name keeps its content (so a typo never silently deletes a block).
#   - The marker must be the paragraph's only text; spacing inside the braces is
#     tolerated (e.g. "{{ #if flag }}"). Markers split across runs by Word are
#     still detected. Blocks may be nested.
#   - Granularity is block-level (whole paragraphs/tables between the markers).
#     Conditionals inside table cells, headers and footers are not handled yet.
#   - Unbalanced markers do not fail the document: a warning is logged, all
#     content is kept, and the marker paragraphs are stripped. A {{/if}} pairs
#     with the most recently opened block (nesting order), not by name.
#
# =============================================================================
# WORD STYLES USED BY THE SYSTEM
# =============================================================================
# When creating custom templates, ensure these styles exist in your document.
# You can customize their appearance in Word (font, size, color, spacing, etc.)
# and the system will use your customizations.
#
# Heading styles (used for markdown # headings):
#   - Heading 1    (# text)
#   - Heading 2    (## text)
#   - Heading 3    (### text)
#   - Heading 4    (#### text)
#   - Heading 5    (##### text)
#   - Heading 6    (###### text)
#
# List styles (used for markdown lists):
#   - List Bullet      (- item, * item, + item) - top level
#   - List Bullet 2    (nested bullet — indent child items one level)
#   - List Bullet 3    (deeply nested bullet — indent two levels)
#   - List Number      (1. item) - top level
#   - List Number 2    (nested numbered — indent child items one level)
#   - List Number 3    (deeply nested numbered — indent two levels)
#
# Other styles:
#   - Quote            (> blockquote text) - only in base tool
#   - Table Grid       (for markdown tables) - only in base tool
#   - Normal           (regular paragraphs)
#
# TIP: To customize styles in your template:
#   1. Open your template in Word
#   2. Go to Home > Styles
#   3. Right-click on a style > Modify
#   4. Customize font, paragraph spacing, colors, etc.
#   5. Save the template
#
# =============================================================================
# MARKDOWN FORMATTING SUPPORT
# =============================================================================
#
# Inline formatting (works within any text — paragraphs, headings, lists, cells):
#   **bold**            -> Bold            *italic*        -> Italic
#   ***bold italic***   -> Bold + italic   ~~strike~~      -> Strikethrough
#   __underline__       -> Underline       ==highlight==   -> Yellow highlight
#   `code`              -> Monospace (Courier New)
#   ^super^ (x^2^)      -> Superscript     ~sub~ (H~2~O)   -> Subscript
#   [link text](url)    -> Clickable hyperlink
#   \* \** \`           -> Escaped literals (render the marker as text)
#   Nesting works, e.g. **bold with *italic* inside**.
#
# Block-level markdown (separate every block with a blank line):
#   Headings:
#     # Heading 1  ...  up to  ###### Heading 6
#
#   Numbered lists (numbering restarts automatically when a list begins at 1.):
#     1. First item
#     2. Second item
#
#   Bullet points (- , * or + ; nest by indenting child items — any
#   consistent unit works: 2, 3 or 4 spaces, or a tab):
#     - Item one
#       - Sub item
#
#   Block quotes:
#     > Quoted text (uses the "Quote" style)
#
#   Fenced code blocks (rendered verbatim in a monospace font, not parsed):
#     ```
#     code stays exactly as written
#     ```
#
#   Tables (Word "Table Grid" style; cells accept inline formatting):
#     | Column 1 | Column 2 |
#     |----------|----------|
#     | Value 1  | Value 2  |
#     Alignment:      |:---|:---:|---:|   -> left / center / right
#     Borderless:     put <!-- borderless --> on the line above the table
#     Column widths:  put <!-- widths: 30 70 --> on the line above the table
#     Cell newline:   use <br> inside a cell for a new paragraph
#
#   Images:           ![alt text](url)
#   Page break:       --- (three+ dashes alone on a line — starts a new page)
#   Horizontal line:  *** (three+ asterisks alone on a line)
#   Text alignment:   <center>text</center>  or  <div align="right|center|justify|left">text</div>
#
# Note: in dynamic templates, block content (lists, headings, tables) is rendered
# for body placeholders; placeholders inside table cells, headers and footers
# receive inline formatting only.
#
# =============================================================================
# LINE BREAKS — three cases (the same in the base tool and in templates)
# =============================================================================
#   New paragraph        -> leave a BLANK LINE between the blocks.
#   Soft break / newline -> use <br>  (a line break inside the same paragraph,
#                           e.g. an address block: Street<br>City).
#                           Two trailing spaces also work but are invisible and
#                           editors strip them — prefer <br>.
#   Literal "\n"         -> NEVER. The two characters backslash-n are text, not a
#                           newline; the model copies whatever it sees. (We now
#                           convert a stray literal "\n" to a real newline rather
#                           than corrupt it, but don't rely on or teach it.)
#
# Writing the `description:` of an argument:
#   * Never put the two characters backslash-n in a description — the model will
#     imitate it and send a literal "\n".
#   * If a description shows a MULTI-LINE example, use a literal block scalar `|`
#     (it preserves the line structure). Do NOT use `>` / `>-` — folded scalars
#     join lines with spaces and destroy the example. Inside a `|` block you also
#     cannot use `#` comments, so mark soft breaks with a visible <br>.
#
# =============================================================================
# CUSTOM STYLE MAPPING (optional)
# =============================================================================
# By default the renderer applies the built-in Word style names listed above.
# If your template defines styles under different names, map them here so the
# rendered markdown picks them up — no need to rename styles in Word.
#
# A top-level `style_mapping:` (below) applies to every template. Each template
# may also declare its own `style_mapping:` which overrides the global one for
# that template only. Unknown style names fall back to the document default
# (with a logged warning) rather than failing the document.
#
# Recognised keys (any subset):
#   heading_1 … heading_6        replace Heading 1 … Heading 6
#   list_number / _2 / _3        replace List Number / List Number 2 / 3
#   list_bullet / _2 / _3        replace List Bullet / List Bullet 2 / 3
#   quote                        replace Quote
#   table                        replace Table Grid
#   normal                       replace Normal
#   code                         paragraph style for fenced code blocks (``` ... ```)
#
# Example (uncomment and adjust to your template's style names):
# style_mapping:
#   heading_1: "Brand Title"
#   list_number: "Brand Numbers"
#   quote: "Brand Quote"
#   table: "Brand Table"
#
# ---------------------------------------------------------------------------
# Ad-hoc style tag (inside markdown content)
# ---------------------------------------------------------------------------
# To apply any style by name to a single block — without adding it to the
# mapping above — put a style directive on its own line directly before the
# block. It applies to the next block only (every item of a list; the table):
#
#   <!-- style: Callout -->
#   This paragraph uses the "Callout" style.
#
#   <!-- style: Highlights -->
#   - first bullet
#   - second bullet
#
# An unknown style name falls back to the document default (with a warning)
# rather than failing the document.


templates:
  # Example: Formal Business Letter
  - name: formal_letter
    description: |
      Generate a formal business letter with customizable recipient, subject, body, and sender information.
      All placeholder values support markdown formatting:
      - Inline: **bold**, *italic*, `code`, [links](url)
      - Block-level: headings (#), bullet lists (-, *, +), numbered lists (1., 2.)
    docx_path: letter_template.docx  # Must be in custom_templates/ directory
    annotations:
      title: Formal Letter Generator
    # Optional per-template style overrides (win over the global style_mapping):
    # style_mapping:
    #   list_number: "Letter Numbers"
    #   quote: "Letter Quote"
    args:
      - name: recipient_name
        type: string
        description: Full name of the recipient (e.g., "John Smith")
        required: true
      - name: recipient_address
        type: string
        description: Recipient's full address. Use line breaks for multiple lines.
        required: true
      - name: date
        type: string
        description: Letter date (e.g., "January 1, 2026")
        required: false
        default: ""
      - name: subject
        type: string
        description: Letter subject line
        required: true
      - name: salutation
        type: string
        description: Opening salutation (e.g., "Dear Mr. Smith")
        required: true
      - name: body
        type: string
        description: Main body of the letter
        required: true
      - name: closing
        type: string
        description: Closing phrase (e.g., "Sincerely,")
        required: false
        default: "Sincerely,"
      - name: sender_name
        type: string
        description: Sender's full name
        required: true
      - name: sender_title
        type: string
        description: Sender's job title or position
        required: false
        default: ""
      # Example of a boolean flag driving a conditional block in the template.
      # Wrap the optional content in the .docx with {{#if include_postscript}} ...
      # {{/if}} to include it only when this is true.
      # - name: include_postscript
      #   type: bool
      #   description: Include the postscript (P.S.) block.
      #   required: false
      #   default: false

  # ===========================================================================
  # Line-break demo: shows how to describe the three break cases to the model.
  # Note every `description:` uses a literal block scalar `|` (preserves lines)
  # and uses <br> for soft breaks — never a literal backslash-n.
  # ===========================================================================
  - name: letterhead_breaks_demo
    description: |
      DOCUMENTATION ONLY — reference example, not for real output. Illustrates the
      three line-break cases in argument descriptions. Points at letter_template.docx
      whose placeholders may not match these names, so treat it as a reference.
    docx_path: letter_template.docx   # reuse any template that has the placeholders
    annotations:
      title: "Line-break demo (reference only)"
    args:
      # SOFT BREAK case: a multi-line block that stays ONE paragraph (use <br>).
      - name: hlavicka
        type: string
        required: true
        description: |
          Document letterhead, several lines forming ONE block.
          Put a <br> between lines (soft break — a line break inside one paragraph);
          do NOT leave blank lines here, or it would split into paragraphs.
          Example:
          JUDr. Jan Novák, advokát<br>Jáchymova 26/2<br>110 00 Praha 1
      # NEW PARAGRAPH case: prose where each paragraph is separate (blank line).
      - name: text
        type: string
        required: true
        description: |
          Body text (Markdown). Break rules:
          - New paragraph: leave a BLANK LINE between paragraphs.
          - Line break inside a paragraph: use <br>.
          - Numbered clauses: each item on its own line ("1. ...", "2. ...").
          Never write the characters backslash-n. Example:
          Vážený pane,

          obracím se na Vás ve věci smluvní pokuty.

          S pozdravem
      # MIXED case: bold heading + soft-break list, all one paragraph.
      - name: prilohy
        type: string
        required: false
        default: " "   # a space keeps the placeholder from rendering as-is when omitted
        description: |
          Attachment list; if none, send a single space. Bold heading, each
          attachment on its own line via <br>. Example:
          **Přílohy:**<br>1. Plná moc<br>2. Výzva k zaplacení
      - name: file_name
        type: string
        required: false
        default: ""
        description: |
          Optional output filename (without the .docx extension).

  # ===========================================================================
  # Procesní podání — Czech court filing (žaloba, vyjádření, odvolání, návrh…)
  # built from custom_templates/procesni_podani_template.docx.
  #
  # The template carries the firm's styles; markdown in text_podani maps onto
  # them via style_mapping below:
  #   #  heading   -> Oddíl_číslování      (centered section heading, auto I., II., …)
  #   ## heading   -> Pododdíl_číslování   (subsection, auto I. A, …)
  #   1. item      -> Odstavec_číslování   (numbered filing paragraph 1., 2., …)
  #   nested item  -> Pododstavec          (a., b., …)
  # Citations are written inline (italics in quotation marks), not as blocks.
  # Petit / přílohy / důkazy items are styled per block with an ad-hoc
  # <!-- style: … --> tag (see the argument descriptions).
  # ===========================================================================
  - name: procesni_podani
    description: |
      Vytvoří procesní podání k soudu v ČR (žalobu, vyjádření, odvolání, návrh…)
      jako soubor .docx podle vzoru kanceláře. Hlavička (soud, spisová značka,
      strany, název podání), přílohy, důkazy a petit se vyplňují samostatnými
      argumenty; vlastní text podání je Markdown se strukturou popsanou u
      argumentu text_podani (oddíly, číslované odstavce, důkazy, citace).
    docx_path: procesni_podani_template.docx
    annotations:
      title: Procesní podání (soud)
    style_mapping:
      heading_1: "Oddíl_číslování"
      heading_2: "Pododdíl_číslování"
      list_number: "Odstavec_číslování"
      list_number_2: "Pododstavec"
    args:
      - name: soud
        type: string
        required: true
        description: |
          Soud, jemuž je podání adresováno, ve 3. pádě, s adresou; řádky odděl <br>.
          Např.: Městskému soudu v Praze<br>Slezská 2000/9<br>120 00 Praha 2
      - name: prostrednictvim
        type: string
        required: false
        default: " "
        description: |
          Jen u opravných prostředků: soud, jehož prostřednictvím se podání činí,
          včetně návětí "prostřednictvím:"; řádky odděl <br>. Jinak pošli jednu mezeru.
          Např.: prostřednictvím:<br>Obvodního soudu pro Prahu 1<br>Ovocný trh 14<br>112 94 Praha 1
      - name: doruceni
        type: string
        required: false
        default: " "
        description: |
          Elektronická adresa soudu pro doručení, např. "DS: abc1234" nebo
          "email: podatelna@soud.cz". Pokud se neuvádí, pošli jednu mezeru.
      - name: misto_datum
        type: string
        required: true
        description: Místo a datum podání, např. "Praha 26. května 2026".
      - name: spisova_znacka
        type: string
        required: false
        default: " "
        description: |
          Spisová značka řízení včetně návětí, např. "Ke sp. zn.: 21 Cm 7/2026".
          U nové žaloby (řízení dosud nemá spisovou značku) pošli jednu mezeru.
      - name: zalobce_oznaceni
        type: string
        required: false
        default: "Žalobce:"
        description: |
          Procesní označení první strany, výchozí "Žalobce:" — u jiných řízení
          např. "Navrhovatel:", "Odvolatel:", "Stěžovatel:".
      - name: zalobce
        type: string
        required: true
        description: |
          Označení první strany: jméno/firma, IČO nebo datum narození, sídlo/bydliště;
          řádky odděl <br>. Např.: ABC s.r.o., IČO: 123 45 678<br>se sídlem Dlouhá 1, 110 00 Praha 1
      - name: zalobce_zastupce_oznaceni
        type: string
        required: false
        default: "Zastoupen:"
        description: |
          Popisek řádku zastoupení první strany, výchozí "Zastoupen:".
          Není-li strana zastoupena, pošli jednu mezeru.
      - name: zalobce_zastupce
        type: string
        required: false
        default: " "
        description: |
          Právní zástupce první strany; řádky odděl <br>. Není-li strana zastoupena,
          pošli jednu mezeru. Např.: JUDr. Jan Novák, advokát<br>se sídlem Jáchymova 26/2, 110 00 Praha 1
      - name: zalovany_oznaceni
        type: string
        required: false
        default: "Žalovaný:"
        description: |
          Procesní označení druhé strany, výchozí "Žalovaný:" — u jiných řízení
          např. "Odpůrce:", "Povinný:".
      - name: zalovany
        type: string
        required: true
        description: |
          Označení druhé strany: jméno/firma, IČO nebo datum narození, sídlo/bydliště;
          řádky odděl <br>.
      - name: zalovany_zastupce_oznaceni
        type: string
        required: false
        default: "Zastoupen:"
        description: |
          Popisek řádku zastoupení druhé strany, výchozí "Zastoupen:".
          Není-li strana zastoupena, pošli jednu mezeru.
      - name: zalovany_zastupce
        type: string
        required: false
        default: " "
        description: |
          Právní zástupce druhé strany; řádky odděl <br>. Není-li strana zastoupena,
          pošli jednu mezeru.
      - name: typ_rizeni
        type: string
        required: true
        description: Předmět řízení, např. "o zaplacení 1 000 000 Kč s příslušenstvím".
      - name: nazev_podani
        type: string
        required: true
        description: |
          Název podání velkými písmeny, např. "VYJÁDŘENÍ ŽALOVANÉHO K ŽALOBĚ"
          nebo "ODVOLÁNÍ ŽALOBCE PROTI ROZSUDKU MĚSTSKÉHO SOUDU V PRAZE".
      - name: dvojmo
        type: string
        required: false
        default: " "
        description: |
          U listinných podání počet stejnopisů, např. "DVOJMO" či "TROJMO".
          U elektronických podání pošli jednu mezeru.
      - name: zpusob_podani
        type: string
        required: false
        default: "E-MAILEM SE ZARUČENÝM ELEKTRONICKÝM PODPISEM"
        description: |
          Způsob podání v záhlaví dokumentu, velkými písmeny,
          např. "DATOVOU SCHRÁNKOU".
      - name: text_podani
        type: string
        required: true
        description: |
          Vlastní text podání v Markdownu. Pravidla:
          - Oddíl uvozuj nadpisem "# NÁZEV ODDÍLU" (číslování I., II., … doplní
            Word automaticky); pododdíl "## NÁZEV PODODDÍLU".
          - Číslované odstavce podání piš jako položky seznamu "1. Text.";
            číslování MUSÍ navazovat napříč oddíly — v dalším oddíle pokračuj
            např. "5. …", nezačínej znovu od 1.
          - Podbody (druhá úroveň číslování a., b., …) piš jako vnořený seznam
            odsazený třemi mezerami hned pod nadřazeným odstavcem, bez
            prázdných řádků mezi podbody (viz příklad u odstavce 4).
          - Mezi nadpisy, odstavci a dalšími bloky nech vždy prázdný řádek.
          - Důkazy vlož za odstavec, k němuž se vážou: nejprve samostatný
            odstavec s návětím "Důkaz:" (či "Důkazy:") uvozený řádkem
            <!-- style: Důkazy -->, pak odrážkový seznam důkazů uvozený řádkem
            <!-- style: Důkazy odrážky --> (každý důkaz jako položka "- …").
          - Citace (judikatura, smluvní ujednání) piš přímo v textu odstavce,
            v uvozovkách a kurzívou: *„citovaný text"*. Nepoužívej blockquote
            (>) ani samostatné odsazené odstavce.
          - Poslední oddíl zakonči nadpisem "# NÁVRH VÝROKU ROZHODNUTÍ" a
            číslovaným odstavcem tučně, např. "9. **S ohledem na výše uvedené
            žalobce navrhuje, aby nadepsaný soud vydal tento**".
          Příklad:
          # SKUTKOVÝ STAV

          1. Žalobce se žalobou domáhá zaplacení částky 1 000 000 Kč.

          2. Smlouvou ze dne 1. 1. 2026 se žalovaný zavázal…

          <!-- style: Důkazy -->
          Důkaz:

          <!-- style: Důkazy odrážky -->
          - smlouva ze dne 1. 1. 2026
          - výslech svědka Jana Nováka

          # PRÁVNÍ POSOUZENÍ

          ## K NÁROKU NA ÚROK Z PRODLENÍ

          3. Podle § 1970 občanského zákoníku…

          4. Nárok žalobce je dán, neboť:
             1. pohledávka je splatná,
             2. žalovaný je v prodlení.

          # NÁVRH VÝROKU ROZHODNUTÍ

          5. **S ohledem na výše uvedené žalobce navrhuje, aby nadepsaný soud vydal tento**
      - name: ma_petit
        type: bool
        required: false
        default: true
        description: |
          True, pokud podání obsahuje návrh výroku rozhodnutí (petit); false
          např. u pouhé omluvy z jednání či sdělení soudu.
      - name: rozhodnuti
        type: string
        required: false
        default: "R O Z S U D E K"
        description: |
          Označení navrhovaného rozhodnutí psané proloženě (mezera mezi písmeny),
          např. "R O Z S U D E K", "U S N E S E N Í" či "P L A T E B N Í   R O Z K A Z".
      - name: petit
        type: string
        required: false
        default: " "
        description: |
          Navrhované výroky rozhodnutí. KAŽDÝ výrok jako samostatný odstavec
          oddělený prázdným řádkem a uvozený řádkem <!-- style: Petit -->
          (číslování I., II., … doplní Word automaticky). Není-li petit
          (ma_petit=false), pošli jednu mezeru. Příklad:
          <!-- style: Petit -->
          Žalovaný je povinen zaplatit žalobci částku 1 000 000 Kč s úrokem z
          prodlení ve výši 9 % ročně od 1. 1. 2026 do zaplacení, to vše do 3 dnů
          ode dne právní moci tohoto rozsudku.

          <!-- style: Petit -->
          Žalovaný je povinen zaplatit žalobci k rukám právního zástupce žalobce
          náhradu nákladů řízení včetně DPH do 3 dnů ode dne právní moci tohoto rozsudku.
      - name: ma_prilohy
        type: bool
        required: false
        default: true
        description: |
          True, pokud má podání přílohy (vypíší se pod nadpisem "Přílohy:");
          false vloží text "Bez příloh."
      - name: prilohy
        type: string
        required: false
        default: " "
        description: |
          Seznam příloh jako číslovaný seznam Markdown uvozený řádkem
          <!-- style: Seznam přílohy -->. Není-li příloh (ma_prilohy=false),
          pošli jednu mezeru. Příklad:
          <!-- style: Seznam přílohy -->
          1. Plná moc právního zástupce žalobce
          2. Smlouva ze dne 1. 1. 2026
          3. Výzva k zaplacení ze dne 1. 3. 2026
      - name: ma_dukazy
        type: bool
        required: false
        default: false
        description: True, pokud podání obsahuje samostatný seznam navrhovaných důkazů.
      - name: dukazy
        type: string
        required: false
        default: " "
        description: |
          Seznam navrhovaných důkazů jako číslovaný seznam Markdown uvozený řádkem
          <!-- style: Seznam důkazy -->. Není-li (ma_dukazy=false), pošli jednu mezeru.
          Příklad:
          <!-- style: Seznam důkazy -->
          1. smlouva ze dne 1. 1. 2026
          2. výslech svědka Jana Nováka
      - name: podpis
        type: string
        required: true
        description: |
          Jméno podepisujícího advokáta (zarovnáno vpravo, tučně). Uvádí se
          POUZE jméno a označení advokáta, nic dalšího.
          Např.: JUDr. Jan Novák, advokát
      - name: cislo_zakazky
        type: string
        required: false
        default: " "
        description: |
          Interní číslo zakázky kanceláře do zápatí dokumentu; pokud se neuvádí,
          pošli jednu mezeru.
      - name: file_name
        type: string
        required: false
        default: ""
        description: Volitelný název výstupního souboru (bez přípony .docx).


